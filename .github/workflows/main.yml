---
name: CI

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: "Optional pytest arguments to narrow the test run"
        required: false
        default: ""

env:
  PIP_INDEX_URL: "https://:2023-07-18@time-machines-pypi.sealsecurity.io/"

jobs:
  tests:
    name: "Python ${{ matrix.python-version }} on ${{ matrix.platform }}"
    runs-on: "${{ matrix.platform }}"
    timeout-minutes: 45
    env:
      USING_COVERAGE: '3.7,3.8'

    strategy:
      fail-fast: false
      matrix:
        platform: ["ubuntu-latest", "windows-latest"]
        python-version: ["3.7", "3.8", "3.9", "3.10", "3.11", "pypy-3.8", "pypy-3.9"]
        exclude:
          - platform: "ubuntu-latest"
            python-version: "3.7"

    steps:
      - uses: "actions/checkout@v4"
      - uses: "actions/setup-python@v5"

        with:
          python-version: "${{ matrix.python-version }}"

      - name: "Install dependencies"
        run: |
          python -VV
          python -m site
          python -m pip install --upgrade setuptools wheel
          python -m pip install --upgrade coverage[toml] virtualenv tox tox-gh-actions

      - name: "Run tox targets for ${{ matrix.python-version }}"
        run: "python -m tox -- ${{ inputs.test-filter }}"

      # We always use a modern Python version for combining coverage to prevent
      # parsing errors in older versions for modern code.
      - uses: "actions/setup-python@v5"
        if: "contains(env.USING_COVERAGE, matrix.python-version) && matrix.platform == 'ubuntu-latest'"
        with:
          python-version: "3.8"

      - name: "Combine coverage"
        run: |
          set -xe
          python -m pip install coverage[toml]
          python -m coverage combine
          python -m coverage xml
        if: "contains(env.USING_COVERAGE, matrix.python-version) && matrix.platform == 'ubuntu-latest'"

  package:
    name: "Build & verify package"
    runs-on: "ubuntu-latest"
    timeout-minutes: 30

    steps:
      - uses: "actions/checkout@v4"
      - uses: "actions/setup-python@v5"

        with:
          python-version: "3.8"

      - name: "Install pinned build tooling"
        run: "python -m pip install --force-reinstall 'setuptools==68.0.0' 'wheel==0.40.0' 'build==0.10.0' twine"

      - name: "Build package"
        run: "python -m build --no-isolation"

      - name: "List result"
        run: "ls -l dist"

      - name: "Check long_description"
        run: "python -m twine check dist/*"

      - name: "Upload dist"
        uses: "actions/upload-artifact@v4"
        with:
          name: "dist"
          path: "dist/*"
          if-no-files-found: error

  install-dev:
    if: false
    timeout-minutes: 15
    strategy:
      matrix:
        os: ["ubuntu-latest", "windows-latest", "macos-latest"]

    name: "Verify dev env"
    runs-on: "${{ matrix.os }}"

    steps:
      - uses: "actions/checkout@v4"
      - uses: "actions/setup-python@v5"

        with:
          python-version: "3.8"

      - name: "Install in dev mode"
        run: "python -m pip install -e .[dev]"

      - name: "Import package"
        run: "python -c 'import jwt; print(jwt.__version__)'"
